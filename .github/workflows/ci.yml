name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci && cd frontend && npm ci

      - name: Lint (fail on warnings)
        run: cd frontend && npm run lint -- --max-warnings 0

      - name: Type check
        run: cd frontend && npm run typecheck

  test:
    name: Tests (Frontend + Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          npm ci && cd frontend && npm ci
          cd ../backend/lambdas/search-autocomplete && npm ci

      - name: Run tests
        run: npm test -- --reporter=verbose

  validate-sam:
    name: Validate SAM Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Lambda dependencies
        run: cd backend/lambdas && npm ci

      - name: Validate SAM template
        run: |
          pip install aws-sam-cli
          cd backend && sam validate --region us-west-2

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, validate-sam]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci && cd frontend && npm ci

      - name: Build frontend
        run: npm run build

  status-check:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint, test, validate-sam, build]
    if: always()
    steps:
      - name: Verify all jobs passed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.validate-sam.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "One or more checks failed"
            exit 1
          fi
          echo "All checks passed"
