name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'package-lock.json'
              # Lint and typecheck now cover these too, and the e2e job runs
              # from them. Without these entries a change to a spec or a script
              # would skip the very job that was widened to check it.
              - 'tests/**'
              - 'scripts/**'
              - 'eslint.config.cjs'
              - 'tsconfig.e2e.json'
              - 'vitest.config.ts'
              - 'playwright.config.ts'
            backend:
              - 'backend/**'

  check:
    name: Lint, Type Check & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (fail on warnings)
        run: npm run lint -- --max-warnings 0

      - name: Type check
        run: npm run typecheck

      # Checks the whole repo, not a glob. .prettierignore carries the two
      # exclusions that keep this gate honest: .claude/, because Prettier does
      # not read .gitignore and a local worktree would make this red locally and
      # green here; and the ADR-2 backend paths, which no phase may modify.
      - name: Format check
        run: npm run format:check

      # Coverage thresholds live in vitest.config.ts and are calibrated to the
      # measured actual. `npm test` stays coverage-free so the local loop and the
      # pre-commit hook stay fast; CI is where the gate runs.
      - name: Tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  validate-sam:
    name: Validate SAM Template
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Lambda dependencies
        run: cd backend/lambdas && npm ci

      - name: Validate SAM template
        run: |
          pip install aws-sam-cli
          cd backend && sam validate --region us-west-2

  status-check:
    name: All Checks Passed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check, validate-sam]
    if: always()
    steps:
      - name: Verify
        run: |
          results=(
            "${{ needs.check.result }}"
            "${{ needs.validate-sam.result }}"
          )
          for result in "${results[@]}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "One or more checks failed: $result"
              exit 1
            fi
          done
          echo "All checks passed!"
