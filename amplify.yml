version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Amplify Hosting does not read the repository's .nvmrc, so the version
        # pinned there and in `engines` has to be selected explicitly here or
        # the build silently runs on the image default.
        - nvm use 22
        - npm ci
    build:
      commands:
        - cd frontend && npm run build
  artifacts:
    baseDirectory: frontend/build
    files:
      - '**/*'
  customHeaders:
    - pattern: '**/*.html'
      headers:
        - key: Cache-Control
          value: 'no-cache, no-store, must-revalidate'
    - pattern: 'assets/**/*'
      headers:
        - key: Cache-Control
          value: 'public, max-age=31536000, immutable'
  cache:
    paths:
      # The workspace install hoists to the root; frontend/node_modules keeps
      # only the few version-conflict entries npm places there.
      - node_modules/**/*
      - frontend/node_modules/**/*
