<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f5f5dc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#daa520;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Decorative elements - quill/feather suggestion -->
  <ellipse cx="600" cy="315" rx="400" ry="200" fill="none" stroke="#daa520" stroke-width="1" opacity="0.2"/>
  <ellipse cx="600" cy="315" rx="350" ry="175" fill="none" stroke="#daa520" stroke-width="1" opacity="0.15"/>

  <!-- Open book icon -->
  <g transform="translate(500, 180)">
    <path d="M100 0 C60 10, 20 30, 0 60 L0 140 C20 110, 60 90, 100 80 Z" fill="#f5f5dc" opacity="0.9"/>
    <path d="M100 0 C140 10, 180 30, 200 60 L200 140 C180 110, 140 90, 100 80 Z" fill="#f5f5dc" opacity="0.9"/>
    <line x1="100" y1="0" x2="100" y2="80" stroke="#1a1a2e" stroke-width="2"/>
    <!-- Page lines -->
    <line x1="20" y1="50" x2="80" y2="40" stroke="#1a1a2e" stroke-width="1" opacity="0.3"/>
    <line x1="20" y1="70" x2="80" y2="55" stroke="#1a1a2e" stroke-width="1" opacity="0.3"/>
    <line x1="20" y1="90" x2="80" y2="70" stroke="#1a1a2e" stroke-width="1" opacity="0.3"/>
    <line x1="120" y1="40" x2="180" y2="50" stroke="#1a1a2e" stroke-width="1" opacity="0.3"/>
    <line x1="120" y1="55" x2="180" y2="70" stroke="#1a1a2e" stroke-width="1" opacity="0.3"/>
    <line x1="120" y1="70" x2="180" y2="90" stroke="#1a1a2e" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Main title -->
  <text x="600" y="400" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="url(#textGradient)" text-anchor="middle">The Writer's Almanac</text>

  <!-- Subtitle -->
  <text x="600" y="470" font-family="Georgia, serif" font-size="32" fill="#f5f5dc" text-anchor="middle" opacity="0.9">Daily Poetry &amp; History</text>

  <!-- Decorative line -->
  <line x1="300" y1="510" x2="900" y2="510" stroke="#daa520" stroke-width="2" opacity="0.5"/>

  <!-- Tagline -->
  <text x="600" y="560" font-family="Georgia, serif" font-size="24" fill="#f5f5dc" text-anchor="middle" opacity="0.7" font-style="italic">with Garrison Keillor</text>
</svg>
